<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share location</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f1f5f9; text-align: center;
      background: radial-gradient(1200px 700px at 20% 10%, #312e81 0%, transparent 60%),
                  radial-gradient(900px 600px at 90% 90%, #831843 0%, transparent 55%), #0b1020;
    }
    .card { width: 92%; max-width: 380px; padding: 32px 26px; border-radius: 28px;
            background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    .brand { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #a5b4fc; font-weight: 700; }
    .icon { font-size: 44px; margin: 16px 0 4px; }
    h1 { font-size: 20px; margin: 6px 0; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin: 8px 0 0; }
    button { width: 100%; margin-top: 14px; padding: 14px; font-size: 15px; font-weight: 700; color: #fff; border: 0; border-radius: 14px; cursor: pointer;
             background: linear-gradient(135deg, #6366f1, #ec4899); }
    button.ghost { background: rgba(255,255,255,.08); color: #cbd5e1; font-weight: 600; }
    .hide { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Snoball &middot; Attendance</div>
    <div class="icon" id="icon">&#128205;</div>
    <h1 id="title">Getting your location...</h1>
    <p id="text">Tap Allow when your browser asks. Your location is saved only for this login or logout.</p>
    <button id="retry" class="hide" onclick="start()">Try again</button>
    <button id="skip" class="ghost hide" onclick="skip()">Continue without sharing</button>
  </div>

<script>
  var q = new URLSearchParams(location.search);
  var token = q.get('token') || '';
  var api = q.get('api') || '';
  var okLink = /^[0-9a-f-]{36}$/.test(token) && api.indexOf('https://script.google.com/') === 0;

  function $(id) { return document.getElementById(id); }

  function show(icon, title, text, buttons) {
    $('icon').textContent = icon;
    $('title').textContent = title;
    $('text').textContent = text;
    $('retry').className = buttons ? '' : 'hide';
    $('skip').className = buttons ? 'ghost' : 'hide';
  }

  function send(params) {
    var p = new URLSearchParams(params);
    p.set('action', 'geo');
    p.set('token', token);
    return fetch(api + '?' + p.toString(), { mode: 'no-cors' });
  }

  function done() {
    show('\u2705', 'Location shared', 'You can close this tab and go back to Attendance.', false);
    setTimeout(function () { try { window.close(); } catch (e) {} }, 1200);
  }

  function skip() {
    send({ status: 'denied' }).then(function () {
      show('\u2139\uFE0F', 'Continuing without location', 'You can close this tab and go back to Attendance. Your entry will be marked "Location not shared".', false);
    }).catch(function () {
      show('\u26A0\uFE0F', 'Could not reach the server', 'Close this tab and go back to Attendance.', false);
    });
  }

  function start() {
    if (!okLink) { show('\u26A0\uFE0F', 'Invalid link', 'Go back to Attendance and tap the button again.', false); return; }
    show('\uD83D\uDCCD', 'Getting your location...', 'Tap Allow when your browser asks. Your location is saved only for this login or logout.', false);
    if (!navigator.geolocation) {
      show('\u26A0\uFE0F', 'Location not supported', 'This browser cannot share location.', true);
      return;
    }
    navigator.geolocation.getCurrentPosition(function (p) {
      send({ status: 'ok', lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy })
        .then(done)
        .catch(function () { show('\u26A0\uFE0F', 'Could not reach the server', 'Check your internet and try again.', true); });
    }, function (err) {
      var blocked = err && err.code === 1;
      show('\uD83D\uDCCD',
           blocked ? 'Location is blocked' : 'Could not get your location',
           blocked ? 'Allow location for this site in your browser or phone settings, then tap Try again.'
                   : 'Turn on GPS and move near a window, then tap Try again.',
           true);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  start();
</script>
</body>
</html>
